name: NCDR Telegram Alert

on:

  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

concurrency:
  group: ncdr-alert
  cancel-in-progress: false


jobs:

  check-alert:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Run NCDR Alert Bot
        env:
          NCDR_API_KEY: ${{ secrets.NCDR_API_KEY }}

          NCDR_ALERT_LIST_URL: ${{ secrets.NCDR_ALERT_LIST_URL }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          python src/main.py


      - name: Save alert state
        run: |

          git config user.name "ncdr-alert-bot"

          git config user.email \
            "ncdr-alert-bot@users.noreply.github.com"

          git add data/sent_alerts.json

          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "Update NCDR alert state"
            git push
          fi
